databases:
  - name: bhowmick-agency-db
    databaseName: bhowmick_agency
    user: bhowmick_agency
    plan: free

services:
  - type: web
    name: bhowmick-agency
    runtime: node
    buildCommand: cd server && npm ci && npm run build && cd ../client && npm ci && npm run build
    startCommand: cd server && npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bhowmick-agency-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_SECRET
        generateValue: true
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
